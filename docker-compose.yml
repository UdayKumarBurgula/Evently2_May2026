version: '3.9'

services:
  evently.api:
    image: ${DOCKER_REGISTRY-}eventlyapi
    container_name: Evently.api
    build:
      context: .
      dockerfile: Evently.Api/Dockerfile
    ports:
        - 5000:8080
        - 5001:8081 
        
  evently.database:
    image: postgres:latest
    container_name: Evently.Database
    environment:    
        - POSTGRES_USER=eventlyuser
        - POSTGRES_PASSWORD=EventlyPassword123!
        - POSTGRES_DB=eventlydb
    volumes:
        - ./.containers/db:/var/lib/postgresql/data
    ports:
        - 5432:5432 